name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant pytest pytest-homeassistant-custom-component ruff mysa-client==0.2.1
      - name: Lint
        run: ruff check custom_components tests
      - name: Test
        run: pytest -q
